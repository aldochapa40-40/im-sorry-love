<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mended With Gold</title>
<meta name="description" content="Tap the cracks.">
<meta property="og:title" content="Mended With Gold">
<meta property="og:description" content="Tap the cracks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'%3E%3Cpath fill='%23E4486C' d='M12 21C5 15.5 1 12 1 7.2 1 3.8 3.6 1.5 6.6 1.5c2.1 0 3.8 1.1 5.4 3.1 1.6-2 3.3-3.1 5.4-3.1 3 0 5.6 2.3 5.6 5.7C23 12 19 15.5 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Shantell+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: one centered screen. Heart in the middle, one line of text under it, a soft closing once the heart is whole. */
:root{
  --bg:#FCE7EC; --ink:#4A1530; --ink-soft:#87506A; --line:#F0C3CF;
  --heart:#E4486C; --heart-hi:#F57592; --heart-shade:#BF3157; --accent:#BF3157;
  --gold:#D49A1F; --gold-hi:#F3BE45;
  --blush:#FFA3B8; --tear:#8FD0FF; --face:#3B0F23;
  --font-display:"Shantell Sans","Chalkboard SE","Comic Sans MS",cursive;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F0F19; --ink:#FBE5EC; --ink-soft:#CDA0B3; --line:#4C2A3B;
    --heart:#EC5478; --heart-hi:#FF84A1; --heart-shade:#B9365A; --accent:#FF84A1;
    --gold:#E5B045; --gold-hi:#FFD36E;
    --blush:#FF9EB5; --tear:#9ED8FF; --face:#3B0F23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F0F19; --ink:#FBE5EC; --ink-soft:#CDA0B3; --line:#4C2A3B;
  --heart:#EC5478; --heart-hi:#FF84A1; --heart-shade:#B9365A; --accent:#FF84A1;
  --gold:#E5B045; --gold-hi:#FFD36E;
  --blush:#FF9EB5; --tear:#9ED8FF; --face:#3B0F23;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:40px;
  display:flex;
  -webkit-font-smoothing:antialiased;
}
p{margin:0}
.stage{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}

h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(48px, 13vw, 72px);line-height:1;letter-spacing:-.02em;color:var(--ink)}

.heart{width:min(300px, 78vw);height:auto;overflow:visible;transform-origin:50% 60%;animation:wobble 4.5s ease-in-out infinite;transition:filter .6s}
.heart.whole{animation:beat 1.3s ease-in-out infinite;filter:drop-shadow(0 0 20px color-mix(in srgb, var(--gold-hi) 60%, transparent))}
.heart-body{cursor:pointer}
.gloss{fill:#fff;fill-opacity:.32;pointer-events:none}
.face{pointer-events:none}
.cheek{fill:var(--blush);opacity:.75}
.eyes-open circle{fill:var(--face)}
.eyes-open .glint{fill:#fff}
.eyes-happy path,.mouth{fill:none;stroke:var(--face);stroke-width:3.4;stroke-linecap:round}
.eyes-open,.eyes-happy{transition:opacity .4s}
.eyes-happy{opacity:0}
.heart.whole .eyes-open{opacity:0}
.heart.whole .eyes-happy{opacity:1}
.tear{fill:var(--tear);transition:opacity .5s, transform .5s}
.heart.calm .tear{opacity:0;transform:translateY(6px)}

.crack{cursor:pointer;outline:none}
.crack .hit{fill:none;stroke:transparent;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.crack .gap{fill:none;stroke:var(--bg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.crack .seam{fill:none;stroke:var(--gold-hi);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s ease}
.crack.mended .seam{stroke-dashoffset:0;filter:drop-shadow(0 0 3px var(--gold-hi))}
.crack .pulse{fill:var(--gold-hi);transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.crack .ring{fill:none;stroke:transparent;stroke-width:2.4}
.crack:hover .ring,.crack:focus-visible .ring{stroke:var(--face)}
.crack.mended{cursor:default}
.crack.mended .pulse,.crack.mended .ring{display:none}

.note{font-family:var(--font-display);font-size:20px;line-height:1.5;color:var(--ink);min-height:3em;max-width:24em;text-wrap:balance}
.note.waiting{color:var(--ink-soft);font-size:18px}
.note.in{animation:ink-in .5s ease both}

.dots{display:flex;gap:10px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background-color .4s, transform .4s}
.dots span.on{background:var(--gold-hi);transform:scale(1.15)}

.end{display:flex;flex-direction:column;align-items:center;gap:16px;animation:ink-in .7s ease both}
.closing{font-size:17px;color:var(--ink-soft);max-width:22em;text-wrap:balance}
.again{font:inherit;font-weight:800;font-size:16px;border-radius:999px;padding:11px 22px;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);display:inline-flex;align-items:center;gap:8px;transition:transform .15s, border-color .2s}
.again:hover{transform:translateY(-2px);border-color:var(--ink-soft)}
.again:active{transform:none}
.again:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.again svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.sign{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--accent);margin-top:8px}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fly{position:absolute;width:18px;height:18px;color:var(--c);transform:translate(-50%,-50%);animation:fly 1s cubic-bezier(.2,.7,.3,1) forwards}
.fly svg{display:block;width:100%;height:100%;fill:currentColor}

@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(.99)}45%{transform:scale(1.05)}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.3);opacity:1}}
@keyframes ink-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fly{
  from{transform:translate(-50%,-50%) scale(.3);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(var(--s));opacity:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="stage">
  <h1>I'm sorry</h1>

  <svg class="heart" id="heart" viewBox="0 0 200 180" role="group" aria-label="A cracked heart. Each crack hides something I want to tell you.">
    <defs>
      <radialGradient id="shine" cx="35%" cy="28%" r="78%">
        <stop offset="0" style="stop-color:var(--heart-hi)"/>
        <stop offset=".55" style="stop-color:var(--heart)"/>
        <stop offset="1" style="stop-color:var(--heart-shade)"/>
      </radialGradient>
    </defs>
    <path class="heart-body" id="heartBody" fill="url(#shine)" d="M100 170 C40 125 8 95 8 58 C8 30 30 10 56 10 C76 10 92 22 100 38 C108 22 124 10 144 10 C170 10 192 30 192 58 C192 95 160 125 100 170 Z"/>
    <ellipse class="gloss" cx="50" cy="36" rx="17" ry="9" transform="rotate(-28 50 36)"/>

    <g class="face">
      <ellipse class="cheek" cx="72" cy="100" rx="9" ry="5.5"/>
      <ellipse class="cheek" cx="128" cy="100" rx="9" ry="5.5"/>
      <g class="eyes-open">
        <circle cx="84" cy="86" r="5.4"/>
        <circle cx="116" cy="86" r="5.4"/>
        <circle class="glint" cx="85.9" cy="84.1" r="1.7"/>
        <circle class="glint" cx="117.9" cy="84.1" r="1.7"/>
      </g>
      <g class="eyes-happy">
        <path d="M78 88 Q84 80 90 88"/>
        <path d="M110 88 Q116 80 122 88"/>
      </g>
      <path class="tear" d="M80 93 Q75.5 100 80 103.5 Q84.5 100 80 93Z"/>
      <path class="mouth" id="mouth" d="M91 105 Q100 95 109 105"/>
    </g>

    <g class="crack" data-i="0" tabindex="0" role="button" aria-label="Mend crack 1">
      <path class="hit" d="M100 38 L95 50 L103 58 L97 68"/>
      <path class="gap" d="M100 38 L95 50 L103 58 L97 68"/>
      <path class="seam" pathLength="1" d="M100 38 L95 50 L103 58 L97 68"/>
      <circle class="ring" cx="99" cy="54" r="10"/>
      <circle class="pulse" cx="99" cy="54" r="4.5"/>
    </g>
    <g class="crack" data-i="1" tabindex="0" role="button" aria-label="Mend crack 2">
      <path class="hit" d="M24 46 L38 52 L34 64 L48 70"/>
      <path class="gap" d="M24 46 L38 52 L34 64 L48 70"/>
      <path class="seam" pathLength="1" d="M24 46 L38 52 L34 64 L48 70"/>
      <circle class="ring" cx="36" cy="58" r="10"/>
      <circle class="pulse" cx="36" cy="58" r="4.5"/>
    </g>
    <g class="crack" data-i="2" tabindex="0" role="button" aria-label="Mend crack 3">
      <path class="hit" d="M176 46 L162 52 L166 64 L152 70"/>
      <path class="gap" d="M176 46 L162 52 L166 64 L152 70"/>
      <path class="seam" pathLength="1" d="M176 46 L162 52 L166 64 L152 70"/>
      <circle class="ring" cx="164" cy="58" r="10"/>
      <circle class="pulse" cx="164" cy="58" r="4.5"/>
    </g>
    <g class="crack" data-i="3" tabindex="0" role="button" aria-label="Mend crack 4">
      <path class="hit" d="M38 96 L50 94 L52 106 L64 112"/>
      <path class="gap" d="M38 96 L50 94 L52 106 L64 112"/>
      <path class="seam" pathLength="1" d="M38 96 L50 94 L52 106 L64 112"/>
      <circle class="ring" cx="51" cy="100" r="10"/>
      <circle class="pulse" cx="51" cy="100" r="4.5"/>
    </g>
    <g class="crack" data-i="4" tabindex="0" role="button" aria-label="Mend crack 5">
      <path class="hit" d="M162 96 L150 94 L148 106 L136 112"/>
      <path class="gap" d="M162 96 L150 94 L148 106 L136 112"/>
      <path class="seam" pathLength="1" d="M162 96 L150 94 L148 106 L136 112"/>
      <circle class="ring" cx="149" cy="100" r="10"/>
      <circle class="pulse" cx="149" cy="100" r="4.5"/>
    </g>
  </svg>

  <p class="note waiting" id="note" aria-live="polite">Tap the cracks. Each one is something I need to tell you.</p>

  <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="end" id="end" hidden>
    <p class="closing">Every crack is gold now. No rush on anything, I just wanted you to know I'm thinking about you.</p>
    <button class="again" id="again" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg>
      Play again
    </button>
  </div>

  <p class="sign">Love, Aldo</p>
</main>

<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var NOTES = [
    "I'm sorry I hurt you. That was never what I wanted.",
    "Your feelings make sense. I'm listening.",
    "Being close to you matters more to me than being right.",
    "I'm going to show you I mean this, not just say it.",
    "You're my favorite person, even on the days I mess up."
  ];
  var WAITING = "Tap the cracks. Each one is something I need to tell you.";

  var heart = document.getElementById('heart');
  var heartBody = document.getElementById('heartBody');
  var mouth = document.getElementById('mouth');
  var cracks = Array.prototype.slice.call(document.querySelectorAll('.crack'));
  var note = document.getElementById('note');
  var dots = Array.prototype.slice.call(document.querySelectorAll('#dots span'));
  var end = document.getElementById('end');
  var again = document.getElementById('again');
  var fx = document.getElementById('fx');
  var mended = [];

  var HEART_SVG = '<svg viewBox="0 0 24 22"><path d="M12 21C5 15.5 1 12 1 7.2 1 3.8 3.6 1.5 6.6 1.5c2.1 0 3.8 1.1 5.4 3.1 1.6-2 3.3-3.1 5.4-3.1 3 0 5.6 2.3 5.6 5.7C23 12 19 15.5 12 21z"/></svg>';
  var COLORS = ['var(--heart)', 'var(--gold-hi)', 'var(--blush)'];

  function burst(x, y, n, spread) {
    if (reduce) return;
    for (var k = 0; k < n; k++) {
      var s = document.createElement('span');
      s.className = 'fly';
      s.innerHTML = HEART_SVG;
      var a = Math.random() * Math.PI * 2;
      var d = spread * (0.4 + Math.random() * 0.8);
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * d - 40).toFixed(1) + 'px');
      s.style.setProperty('--r', (Math.random() * 80 - 40).toFixed(0) + 'deg');
      s.style.setProperty('--s', (0.6 + Math.random() * 0.9).toFixed(2));
      s.style.setProperty('--c', COLORS[k % COLORS.length]);
      s.style.animationDuration = (700 + Math.random() * 700).toFixed(0) + 'ms';
      s.addEventListener('animationend', function () { this.remove(); });
      fx.appendChild(s);
    }
  }
  function burstFrom(el, n, spread) {
    var r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, n, spread);
  }

  var mouthCY = 95;
  function setMouth(target) {
    function draw(v) { mouth.setAttribute('d', 'M91 105 Q100 ' + v.toFixed(2) + ' 109 105'); }
    if (reduce) { mouthCY = target; draw(target); return; }
    var start = mouthCY, t0 = performance.now();
    function step(t) {
      var k = Math.min(1, (t - t0) / 450);
      var e = 1 - Math.pow(1 - k, 3);
      mouthCY = start + (target - start) * e;
      draw(mouthCY);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function showNote(text, waiting) {
    note.classList.remove('in');
    note.classList.toggle('waiting', !!waiting);
    note.textContent = text;
    void note.offsetWidth;
    note.classList.add('in');
  }

  function update() {
    var n = mended.length;
    setMouth(95 + n * 4);
    heart.classList.toggle('calm', n >= 2);
    heart.classList.toggle('whole', n >= 5);
    dots.forEach(function (d, k) { d.classList.toggle('on', k < n); });
    end.hidden = n < 5;
  }

  function mend(i) {
    var g = cracks[i];
    if (!g || g.classList.contains('mended')) return;
    g.classList.add('mended');
    g.setAttribute('aria-disabled', 'true');
    g.setAttribute('aria-label', 'Crack ' + (i + 1) + ' is mended');
    g.removeAttribute('tabindex');
    mended.push(i);
    showNote(NOTES[i]);
    burstFrom(g.querySelector('.gap'), 10, 70);
    update();
    if (mended.length === 5) burstFrom(heart, 40, 200);
  }

  function reset() {
    mended = [];
    cracks.forEach(function (g, i) {
      g.classList.remove('mended');
      g.removeAttribute('aria-disabled');
      g.setAttribute('aria-label', 'Mend crack ' + (i + 1));
      g.setAttribute('tabindex', '0');
    });
    showNote(WAITING, true);
    update();
    try { cracks[0].focus({ preventScroll: true }); } catch (e) {}
  }

  cracks.forEach(function (g) {
    var i = Number(g.getAttribute('data-i'));
    g.addEventListener('click', function () { mend(i); });
    g.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mend(i); }
    });
  });

  // Tapping anywhere on the heart mends the nearest open crack; once whole, it sends hearts.
  heartBody.addEventListener('click', function (e) {
    var open = cracks.filter(function (g) { return !g.classList.contains('mended'); });
    if (!open.length) { burst(e.clientX, e.clientY, 12, 80); return; }
    var best = null, bestD = Infinity;
    open.forEach(function (g) {
      var r = g.querySelector('.pulse').getBoundingClientRect();
      var dx = r.left + r.width / 2 - e.clientX, dy = r.top + r.height / 2 - e.clientY;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = g; }
    });
    mend(Number(best.getAttribute('data-i')));
  });

  again.addEventListener('click', reset);
})();
</script>

</body>
</html>
